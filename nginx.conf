server {
  listen 8080;
  root /usr/share/nginx/html;
  error_page 404 /404.html;

  # URLs do Docusaurus são de diretório: no-cache é o padrão, /assets/ (com hash) a exceção.
  # X-Robots-Tag precisa estar em CADA location (add_header em location descarta os do server).
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # Clipes curtos: cacheáveis, mas sem hash no nome.
  location /video/ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
